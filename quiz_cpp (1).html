<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Ôn Tập C/C++</title>
<style>
  :root{
    --bg:#0d1117;
    --panel:#161b22;
    --panel-2:#1c2330;
    --border:#2b3240;
    --text:#e6edf3;
    --muted:#8b96a5;
    --accent:#58a6ff;
    --good:#3fb950;
    --bad:#f85149;
    --mono:'JetBrains Mono','Fira Code',Consolas,monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    line-height:1.5;
    padding:32px 16px 80px;
  }
  .wrap{max-width:820px;margin:0 auto;}
  header{margin-bottom:28px;}
  .eyebrow{
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:.12em;
    color:var(--accent);
    text-transform:uppercase;
    margin-bottom:6px;
  }
  h1{font-size:26px;margin:0 0 6px;}
  .sub{color:var(--muted);font-size:14px;}

  #scoreboard{
    position:sticky;top:0;z-index:5;
    background:rgba(13,17,23,.92);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--border);
    padding:12px 16px;
    margin:0 -16px 24px;
    display:flex;justify-content:space-between;align-items:center;
    font-family:var(--mono);
    font-size:14px;
  }
  #scoreboard .score{color:var(--accent);font-weight:600;}

  .question{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    padding:20px 22px;
    margin-bottom:18px;
  }
  .qnum{
    font-family:var(--mono);
    color:var(--muted);
    font-size:12px;
    margin-bottom:8px;
  }
  .qtext{font-size:16px;margin-bottom:12px;font-weight:600;}
  pre{
    background:var(--panel-2);
    border:1px solid var(--border);
    border-radius:6px;
    padding:12px 14px;
    overflow-x:auto;
    font-family:var(--mono);
    font-size:13.5px;
    margin:0 0 14px;
    color:#c9d1d9;
  }
  .options{display:flex;flex-direction:column;gap:8px;}
  label.opt{
    display:flex;align-items:flex-start;gap:10px;
    padding:10px 12px;
    border:1px solid var(--border);
    border-radius:7px;
    cursor:pointer;
    font-family:var(--mono);
    font-size:14px;
    transition:border-color .15s, background .15s;
  }
  label.opt:hover{border-color:var(--accent);}
  label.opt input{margin-top:3px;accent-color:var(--accent);}
  label.opt.correct{border-color:var(--good);background:rgba(63,185,80,.1);}
  label.opt.wrong{border-color:var(--bad);background:rgba(248,81,73,.1);}

  .explain{
    margin-top:12px;
    padding:10px 12px;
    border-left:3px solid var(--accent);
    background:var(--panel-2);
    font-size:13.5px;
    color:var(--muted);
    display:none;
  }
  .explain.show{display:block;}
  .explain b{color:var(--text);}

  #checkBtn{
    display:block;
    width:100%;
    padding:14px;
    margin-top:8px;
    background:var(--accent);
    color:#0d1117;
    font-weight:700;
    font-size:15px;
    border:none;
    border-radius:8px;
    cursor:pointer;
  }
  #checkBtn:hover{opacity:.9;}
  #resetBtn{
    display:block;
    width:100%;
    padding:12px;
    margin-top:10px;
    background:transparent;
    color:var(--muted);
    border:1px solid var(--border);
    border-radius:8px;
    cursor:pointer;
    font-size:14px;
  }
  #resetBtn:hover{color:var(--text);border-color:var(--accent);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">C / C++ Fundamentals</div>
    <h1>Quiz Ôn Tập C/C++</h1>
    <div class="sub">40 câu hỏi trắc nghiệm — chọn đáp án rồi bấm "Kiểm tra kết quả" ở cuối trang.</div>
  </header>

  <div id="scoreboard">
    <span>Đã trả lời: <span id="answeredCount">0</span>/40</span>
    <span class="score" id="scoreText"></span>
  </div>

  <form id="quizForm"></form>

  <button id="checkBtn">Kiểm tra kết quả</button>
  <button id="resetBtn">Làm lại từ đầu</button>
</div>

<script>
const questions = [
  {
    q: "What is the result of the following C/C++ expression?",
    code: "int a = 5;\nint b = 2;\nint c = a / b;",
    options: ["c is 2.5", "c is 2", "c is 3", "Compilation error"],
    correct: 1,
    explain: "Chia hai số nguyên (int/int) cho kết quả nguyên, phần thập phân bị cắt bỏ: 5/2 = 2."
  },
  {
    q: "What is the result of the following C++ code snippet?",
    code: "#include <iostream>\nusing namespace std;\n\nint main() {\n  int a = 5;\n  int b = 2;\n  cout << float(a) / b;\n  return 0;\n}",
    options: ["1", "2", "2.5", "3", "Compilation Error"],
    correct: 2,
    explain: "float(a) ép kiểu a thành số thực trước khi chia, nên phép chia là float/int → 5.0/2 = 2.5."
  },
  {
    q: "What is the scope of a variable declared inside a for loop in C/C++?",
    options: ["Global scope", "Function scope", "Block scope", "File scope"],
    correct: 2,
    explain: "Biến khai báo trong for (kể cả phần khởi tạo) chỉ tồn tại trong phạm vi khối {} của vòng lặp đó — Block scope."
  },
  {
    q: "What is the result of the following C/C++ expression?",
    code: "int a = 5;\nint b = 2;\nint c = a % b;",
    options: ["c is 1", "c is 2", "c is 0", "Compilation error"],
    correct: 0,
    explain: "Toán tử % lấy phần dư của phép chia nguyên: 5 % 2 = 1 (vì 5 = 2*2 + 1)."
  },
  {
    q: "What is the correct way to sort a vector<string> named words in descending order using STL algorithm?",
    options: [
      "sort(words.begin(), words.end());",
      "sort(words.begin(), words.end(), greater<string>());",
      "sort(words.begin(), words.end(), less<string>());",
      "sort(words.begin(), words.end(), reverse);"
    ],
    correct: 1,
    explain: "greater<string>() là comparator sắp xếp giảm dần. less<string>() là mặc định (tăng dần), reverse không phải comparator hợp lệ cho sort."
  },
  {
    q: "What is the output of the following C++ code snippet?",
    code: "#include <iostream>\nusing namespace std;\n\nint main() {\n  int i = 0;\n  while(i < 3) {\n    cout << i;\n    i++;\n  }\n  return 0;\n}",
    options: ["0 1 2 3", "0 1 2", "1 2 3", "1 2"],
    correct: 1,
    explain: "Vòng lặp in i rồi mới tăng, chạy với i = 0,1,2 (dừng khi i=3), in ra 0 1 2."
  },
  {
    q: "What is the output of the following C++ code snippet?",
    code: "#include <iostream>\nusing namespace std;\n\nint add(int a, int b) {\n    return a + b;\n}\n\nint main() {\n    int sum = add(5, 10);\n    cout << sum;\n    return 0;\n}",
    options: ["510", "15", "5 + 10", "add(5, 10)"],
    correct: 1,
    explain: "Hàm add trả về a+b = 5+10 = 15, sum được gán 15 và in ra 15."
  },
  {
    q: "What is the result of the following C++ code snippet?",
    code: "#include <iostream>\nusing namespace std;\n\nint main() {\n   int a = 5;\n   int b = 2;\n   cout << float(a / b);\n   return 0;\n}",
    options: ["1", "2", "2.5", "3", "Compilation Error"],
    correct: 1,
    explain: "a/b tính trước bằng số nguyên (5/2 = 2), sau đó mới ép kiểu float(2) = 2. Khác với float(a)/b ở câu trên!"
  },
  {
    q: "What is the result of the following C++ expression?",
    code: "int x = 4;\nint y = 2;\nbool result = (x < y) ? true : false;",
    options: ["result is true", "result is false", "result is 1", "result is 0", "All of the others", "result is F"],
    correct: 1,
    explain: "x < y là 4 < 2, sai (false), nên result = false. Khi in ra bằng cout, bool false hiển thị là số 0, nhưng giá trị logic đúng nhất mô tả biến là 'false'."
  },
  {
    q: "What is the output of the following C++ code snippet?",
    code: "#include <iostream>\nusing namespace std;\n\nint main() {\n   int a = 5;\n   a += 3;\n   cout << a;\n   return 0;\n}",
    options: ["5", "3", "8", "15"],
    correct: 2,
    explain: "a += 3 tương đương a = a + 3 = 5 + 3 = 8."
  },
  {
    q: "What is the output of the following C++ code snippet?",
    code: "#include <iostream>\nusing namespace std;\n\nint main() {\n   int a = 5;\n   int b = 3;\n   cout << float(a/b);\n   return 0;\n}",
    options: ["1", "1.6666...", "2", "Compilation Error"],
    correct: 0,
    explain: "a/b tính bằng số nguyên trước (5/3 = 1, làm tròn về 0), rồi mới ép kiểu float(1) = 1."
  },
  {
    q: "What is the output of the following C++ code snippet?",
    code: "#include <iostream>\nusing namespace std;\n\nint main() {\n   int x = 10;\n   int y = ++x;\n   cout << y;\n   return 0;\n}",
    options: ["10", "11", "12", "Compilation Error"],
    correct: 1,
    explain: "++x là tiền tố (prefix increment): tăng x lên trước (x=11) rồi mới gán cho y, nên y = 11."
  },
  {
    q: "What is the size in bytes of the following structure on a system where int is 4 bytes and char is 1 byte?",
    code: "struct Example {\n    int a;\n    char b;\n    int c;\n};",
    options: ["9", "10", "12", "8"],
    correct: 2,
    explain: "Do padding/alignment: int a (4 byte) + char b (1 byte + 3 byte đệm để int c căn lề 4 byte) + int c (4 byte) = 4+4+4 = 12 byte."
  },
  {
    q: "What is the output of the following C++ code snippet?",
    code: "#include <iostream>\nusing namespace std;\n\nstruct Point {\n    int x;\n    int y;\n};\n\nint main() {\n    Point p1 = {10, 20};\n    Point p2;\n    p2 = p1;\n    cout << p2.x << \" \" << p2.y;\n    return 0;\n}",
    options: ["10 20", "0 0", "p1.x p1.y", "Compilation Error"],
    correct: 0,
    explain: "Phép gán p2 = p1 sao chép toàn bộ giá trị các thành viên (x, y) từ p1 sang p2, nên p2.x=10, p2.y=20."
  },
  {
    q: 'What is the correct syntax to output "Hello, World!" in C/C++?',
    options: [
      'printf("Hello, World!");',
      'cout << "Hello, World!" << endl;',
      'System.out.println("Hello, World!");',
      'echo "Hello, World!";'
    ],
    correct: 1,
    explain: "cout << ... << endl; là cú pháp xuất chuẩn trong C++ (iostream). printf là của C, System.out.println là Java, echo là PHP/bash."
  },
  {
    q: "What is the correct way to declare a pointer to a function that takes two integers and returns an integer in C/C++?",
    options: [
      "int *func(int, int);",
      "int (*func)(int, int);",
      "int func(*int, *int);",
      "(*int func)(int, int);"
    ],
    correct: 1,
    explain: "int (*func)(int, int); khai báo func là con trỏ hàm. Dấu ngoặc quanh *func rất quan trọng — nếu bỏ đi (int *func(int,int)) thì đây lại là hàm trả về con trỏ int."
  },
  {
    q: "What is the correct way to call the function add with arguments 5 and 10?",
    options: ["add(5, 10);", "add = 5, 10;", "add <- 5, 10;", "call add(5, 10);"],
    correct: 0,
    explain: "Trong C/C++, gọi hàm theo cú pháp tên_hàm(tham_số_1, tham_số_2)."
  },
  {
    q: "What does the following C++ expression evaluate to?",
    code: "int a = 3;\nint b = 4;\nbool result = (a < b) && (a == 3);",
    options: ["result is true", "result is false", "result is 1", "result is 0", "All of the others"],
    correct: 0,
    explain: "a < b (3<4) đúng, và a == 3 đúng. true && true = true, nên result là true."
  },
  {
    q: "What will be the output of the following C++ code snippet?",
    code: "#include <iostream>\nusing namespace std;\n\nint main() {\n   for(int i = 0; i < 3; i++) {\n     if(i == 1)\n       continue;\n     cout << i;\n   }\n   return 0;\n}",
    options: ["0 1 2", "0 2", "0 1", "1 2"],
    correct: 1,
    explain: "Khi i==1, continue bỏ qua cout và nhảy sang vòng lặp tiếp theo, nên chỉ in ra i=0 và i=2 → \"0 2\"."
  },
  {
    q: "What will be the output of the following program?",
    code: "#include <iostream>\nusing namespace std;\n\nclass D {\n    double v;\npublic:\n    D(double d) : v(d) {}\n    operator int() { return (int)v; }\n};\n\nint main() {\n    D x(3.9);\n    int y = x;\n    cout << y;\n    return 0;\n}",
    options: ["3", "4", "Compilation error", "Runtime error"],
    correct: 0,
    explain: "operator int() là toán tử chuyển đổi kiểu tuỳ chỉnh, trả về (int)v = (int)3.9 = 3 (cắt phần thập phân, không làm tròn)."
  },
  {
    q: "What will be the output of the following program?",
    code: "#include <iostream>\nusing namespace std;\nclass Inner {\npublic:\n    int v;\n    Inner(int x) : v(x) {}\n};\nclass Outer {\n    Inner i;\npublic:\n    Outer(int x) : i(x) {}\n    int get() const { return i.v; }\n};\nint main() {\n    Outer o(7);\n    cout << o.get();\n    return 0;\n}",
    options: ["0", "7", "Compilation error", "Runtime error"],
    correct: 1,
    explain: "Outer(int x) : i(x) {} dùng danh sách khởi tạo để gọi Inner(x), gán i.v = 7. get() trả về i.v = 7."
  },
  {
    q: "What will be the output of the following program?",
    code: "#include <iostream>\nusing namespace std;\nclass Counter {\npublic:\n    static int count;\n    Counter() { count++; }\n    static void printCount() {\n        cout << count;\n    }\n};\nint Counter::count = 0;\nint main() {\n    Counter c1;\n    Counter c2;\n    Counter::printCount();\n    return 0;\n}",
    options: ["1", "2", "0", "Compilation error"],
    correct: 1,
    explain: "count là biến static dùng chung cho mọi đối tượng. Mỗi lần constructor chạy, count++. Tạo c1 và c2 → count = 2."
  },
  {
    q: "What will be the output of the following program?",
    code: "#include <iostream>\nusing namespace std;\nclass Box {\nprivate:\n    int length;\npublic:\n    Box(int l) : length(l) {}\n    friend void increase(Box &b);\n    int getLength() {\n        return length;\n    }\n};\nvoid increase(Box &b) {\n    b.length++;\n}\nint main() {\n    Box b(5);\n    increase(b);\n    cout << b.getLength();\n    return 0;\n}",
    options: ["5", "6", "0", "Compilation error"],
    correct: 1,
    explain: "increase là hàm friend nên có quyền truy cập trực tiếp thành viên private length. b.length tăng từ 5 lên 6."
  },
  {
    q: "What will be the output of the following program?",
    code: "#include <iostream>\nusing namespace std;\nclass InlineTest {\npublic:\n    inline int add(int a, int b) {\n        return a + b;\n    }\n};\nint main() {\n    InlineTest it;\n    cout << it.add(2, 3);\n    return 0;\n}",
    options: ["2", "3", "5", "Compilation error"],
    correct: 2,
    explain: "add(2,3) trả về 2+3 = 5. Từ khoá inline chỉ là gợi ý tối ưu cho trình biên dịch, không ảnh hưởng đến kết quả."
  },
  {
    q: "What will be the output of the following C code snippet?",
    code: "#include <stdio.h>\n\nint main() {\nint a = 5;\nint b = ++a;\nprintf(\"%d %d\", a, b);\nreturn 0;\n}",
    options: ["5 5", "5 6", "6 6", "6 5"],
    correct: 2,
    explain: "++a là tiền tố: tăng a lên 6 trước, rồi gán cho b, nên b cũng = 6. Cả a và b đều là 6."
  },
  {
    q: "What will be the output of the following code snippet?",
    code: "int x = 3;\nswitch(x) {\n   case 1: printf(\"One\"); break;\n   case 2: printf(\"Two\"); break;\n   case 3: printf(\"Three\"); break;\n   default: printf(\"Other\");\n}",
    options: ["Three", "One", "Two", "Other"],
    correct: 0,
    explain: "x = 3 khớp với case 3, in ra \"Three\" rồi break, không rơi xuống các case/default khác."
  },
  {
    q: "What will be the output of the following program?",
    code: "#include <iostream>\nusing namespace std;\nclass Array {\nint arr[3];\n  public:\n  Array() { arr[0]=1; arr[1]=2; arr[2]=3; }\n  int& operator[](int idx) { return arr[idx]; }\n};\nint main() {\n  Array a;\n  a[1] = 5;\n  cout << a[1];\nreturn 0;\n}",
    options: ["2", "3", "5", "Compilation error"],
    correct: 2,
    explain: "operator[] trả về tham chiếu (int&) đến phần tử mảng, nên a[1]=5 thực sự gán 5 vào arr[1]. cout<<a[1] in ra 5."
  },
  {
    q: "What will be the output of the following code?",
    code: "#include <iostream>\n#include <vector>\nusing namespace std;\nint main() {\n    int sum, count;\n    int ia[] = { 1, 3, 2, 5, 7 };\n\n    vector<int> v1(ia, ia + 3);\n    vector<int>::iterator it;\n    sum = 0;\n\n    for (it = v1.begin(); it != v1.end(); ++it) {\n        sum += *it;\n    }\n    cout << sum / v1.size() << \" \";\n    cout << endl;\n    return 0;\n}",
    options: ["2", "6", "2.75", "The code snippet has an execution error."],
    correct: 0,
    explain: "v1 chứa 3 phần tử đầu của ia: {1,3,2}. sum = 1+3+2 = 6. v1.size() = 3 (kiểu size_t), phép chia int/size_t là chia nguyên: 6/3 = 2."
  },
  {
    q: "What will be the output of the following code snippet?",
    code: "int x = 10;\nif (x > 5)\n  x = x + 2;\nelse\n  x = x - 2;\nprintf(\"%d\", x);",
    options: ["12", "8", "10", "5"],
    correct: 0,
    explain: "x = 10 > 5 đúng, nên chạy nhánh if: x = 10 + 2 = 12."
  },
  {
    q: "What will be the result of compiling the following program?",
    code: "#include <iostream>\n  using namespace std;\n  class AB { virtual void f() = 0; };\n\nint main() {\n  AB a;\nreturn 0;\n}",
    options: ["Prints nothing", "Compilation error", "Runtime error", "Undefined behavior"],
    correct: 1,
    explain: "AB có hàm ảo thuần tuý (pure virtual) f() = 0, khiến AB trở thành lớp trừu tượng (abstract class). Không thể khởi tạo trực tiếp đối tượng của lớp trừu tượng → lỗi biên dịch."
  },
  {
    q: "What will be the output of the following C code snippet?",
    code: "#include <stdio.h>\n\nint main() {\n   int x = 10;\n   if (x > 5)\n      if (x > 15)\n         printf(\"High\");\n      else\n         printf(\"Medium\");\n   else\n      printf(\"Low\");\n   return 0;\n}",
    options: ["High", "Medium", "Low", "No output"],
    correct: 1,
    explain: "x=10 → x>5 đúng → vào if(x>15) → sai (10 không > 15) → chạy nhánh else của if bên trong → in \"Medium\". else ngoài cùng gắn với if(x>15) gần nhất (do quy tắc dangling else), không phải với if(x>5)."
  },
  {
    q: "What will be the output of the following C code snippet?",
    code: "#include <stdio.h>\n\nint factorial(int n) {\n   if (n <= 1)\n     return 1;\n   else\n     return n * factorial(n - 1);\n}\n\nint main() {\n   printf(\"%d\", factorial(4));\n   return 0;\n}",
    options: ["4", "24", "12", "1"],
    correct: 1,
    explain: "factorial(4) = 4 * factorial(3) = 4*3*factorial(2) = 4*3*2*factorial(1) = 4*3*2*1 = 24."
  },
  {
    q: "What will be the output of the following program?",
    code: "#include <iostream>\nusing namespace std;\n\nclass P { protected: int x = 10; };\nclass Q : public P { public: int getX() { return x; } };\n\nint main() {\n  Q q;\n  cout << q.getX();\nreturn 0;\n}",
    options: ["0", "10", "Compilation error", "Runtime error"],
    correct: 1,
    explain: "Q kế thừa public từ P, thành viên protected x có thể truy cập từ bên trong lớp con Q. getX() trả về x = 10."
  },
  {
    q: "What will be the output of the following program?",
    code: "#include <iostream>\nusing namespace std;\n\nclass Number {\nint *p;\npublic:\n  Number(int v) { p = new int(v); }\n  Number(const Number &n) { p = new int(*n.p); }\n  void set(int v) { *p = v; }\n  int get() const { return *p; }\n};\n\nint main() {\n  Number n1(5);\n  Number n2 = n1;\n  n2.set(10);\n  cout << n1.get() << \" \" << n2.get();\n  return 0;\n}",
    options: ["10 10", "5 10", "10 5", "Compilation error"],
    correct: 1,
    explain: "Number(const Number &n) là copy constructor tự viết, cấp phát vùng nhớ mới (deep copy) thay vì sao chép con trỏ. Do đó n1 và n2 trỏ đến hai vùng nhớ khác nhau: đổi n2 không ảnh hưởng n1. n1.get()=5, n2.get()=10."
  },
  {
    q: "What will be the output of the following C++ code snippet?",
    code: "#include <iostream>\n#include <string>\nusing namespace std;\n\nint main() {\n    string str1 = \"Hello\";\n    string str2 = \"World\";\n    string str3 = str1 + \" \" + str2;\n    cout << str3;\n    return 0;\n}",
    options: ["HelloWorld", "Hello World", "Hello + World", "World Hello"],
    correct: 1,
    explain: "Toán tử + nối các chuỗi std::string lại với nhau, bao gồm cả chuỗi khoảng trắng \" \" chèn giữa \"Hello\" và \"World\", tạo ra \"Hello World\"."
  },
  {
    q: "What will be the output of the following program?",
    code: "#include <iostream>\nusing namespace std;\n\nclass A {\n  public:\n    A() { cout << \"A\"; }\n    ~A() { cout << \"a\"; }\n};\n\nclass B : public A {\n  public:\n    B() { cout << \"B\"; }\n    ~B() { cout << \"b\"; }\n};\n\nint main() {\n    B b;\n    return 0;\n}",
    options: ["ABba", "BAab", "AbBa", "Compilation error"],
    correct: 0,
    explain: "Khi tạo B: constructor lớp cha A() chạy trước → in \"A\", rồi B() chạy → in \"B\" (kết quả tạm: AB). Khi b hủy ở cuối main: destructor lớp con ~B() chạy trước → in \"b\", rồi ~A() chạy → in \"a\" (thêm: ba). Tổng: ABba."
  },
  {
    q: "What will be the output of the following C++ code snippet?",
    code: "#include <iostream>\nusing namespace std;\n\nvoid modify(int &a) {\n a = a + 10;\n}\n\nint main() {\nint x = 5;\nmodify(x);\ncout << x;\n return 0;\n}",
    options: ["5", "10", "15", "Error"],
    correct: 2,
    explain: "Tham số int &a là tham chiếu (pass by reference), nên modify thao tác trực tiếp trên biến x gốc. x = 5 + 10 = 15."
  },
  {
    q: "What will be the output of the following C code snippet?",
    code: "#include <stdio.h>\n\nvoid display(int num) {\n   if (num > 0)\n     printf(\"Positive\");\n   else if (num < 0)\n     printf(\"Negative\");\n   else\n     printf(\"Zero\");\n}\n\nint main() {\n   display(-5);\n   return 0;\n}",
    options: ["Positive", "Negative", "Zero", "No output"],
    correct: 1,
    explain: "num = -5, điều kiện đầu (num>0) sai, điều kiện else if (num<0) đúng → in \"Negative\"."
  },
  {
    q: "What will be the output of the following program?",
    code: "#include <iostream>\nusing namespace std;\n\nclass Point {\n  public:\n  int x;\n  Point(int v) : x(v) {}\n};\n\nint main() {\n  Point p(10);\n  Point *ptr = &p;\n  ptr->x += 5;\n  cout << p.x;\n  return 0;\n}",
    options: ["10", "15", "5", "Compilation error"],
    correct: 1,
    explain: "ptr là con trỏ trỏ đến p, nên ptr->x tham chiếu trực tiếp đến p.x. p.x = 10 + 5 = 15."
  },
  {
    q: "What will be the output of the following code snippet?",
    code: "int i = 0;\nwhile (i++ < 3) {\nprintf(\"%d \", i);\n}",
    options: ["1 2 3", "0 1 2", "1 2 3 4", "0 1 2 3"],
    correct: 0,
    explain: "i++ là hậu tố: so sánh giá trị i hiện tại với 3 rồi mới tăng i. Vòng 1: so sánh 0<3 (đúng), i thành 1, in 1. Vòng 2: so sánh 1<3 (đúng), i thành 2, in 2. Vòng 3: so sánh 2<3 (đúng), i thành 3, in 3. Vòng 4: so sánh 3<3 (sai), dừng. Kết quả in ra: 1 2 3."
  }
];

const form = document.getElementById('quizForm');

questions.forEach((item, idx) => {
  const qDiv = document.createElement('div');
  qDiv.className = 'question';
  qDiv.dataset.index = idx;

  const num = document.createElement('div');
  num.className = 'qnum';
  num.textContent = `Câu ${idx + 1} / ${questions.length}`;
  qDiv.appendChild(num);

  const qText = document.createElement('div');
  qText.className = 'qtext';
  qText.textContent = item.q;
  qDiv.appendChild(qText);

  if (item.code) {
    const pre = document.createElement('pre');
    pre.textContent = item.code;
    qDiv.appendChild(pre);
  }

  const optsDiv = document.createElement('div');
  optsDiv.className = 'options';
  const letters = ['A','B','C','D','E','F'];

  item.options.forEach((opt, oIdx) => {
    const label = document.createElement('label');
    label.className = 'opt';
    label.innerHTML = `<input type="radio" name="q${idx}" value="${oIdx}"><span>${letters[oIdx]}. ${opt}</span>`;
    label.querySelector('input').addEventListener('change', updateAnsweredCount);
    optsDiv.appendChild(label);
  });
  qDiv.appendChild(optsDiv);

  const explain = document.createElement('div');
  explain.className = 'explain';
  explain.innerHTML = `<b>Giải thích:</b> ${item.explain}`;
  qDiv.appendChild(explain);

  form.appendChild(qDiv);
});

function updateAnsweredCount(){
  let count = 0;
  questions.forEach((_, idx) => {
    if (document.querySelector(`input[name="q${idx}"]:checked`)) count++;
  });
  document.getElementById('answeredCount').textContent = count;
}

document.getElementById('checkBtn').addEventListener('click', () => {
  let score = 0;
  questions.forEach((item, idx) => {
    const qDiv = form.querySelector(`.question[data-index="${idx}"]`);
    const labels = qDiv.querySelectorAll('label.opt');
    const checked = qDiv.querySelector(`input[name="q${idx}"]:checked`);
    const chosen = checked ? parseInt(checked.value) : -1;

    labels.forEach((label, oIdx) => {
      label.classList.remove('correct','wrong');
      if (oIdx === item.correct) label.classList.add('correct');
      else if (oIdx === chosen) label.classList.add('wrong');
    });

    if (chosen === item.correct) score++;
    qDiv.querySelector('.explain').classList.add('show');
  });

  document.getElementById('scoreText').textContent = `Điểm: ${score}/${questions.length}`;
  window.scrollTo({top: document.getElementById('scoreboard').offsetTop, behavior:'smooth'});
});

document.getElementById('resetBtn').addEventListener('click', () => {
  form.reset();
  document.querySelectorAll('label.opt').forEach(l => l.classList.remove('correct','wrong'));
  document.querySelectorAll('.explain').forEach(e => e.classList.remove('show'));
  document.getElementById('scoreText').textContent = '';
  document.getElementById('answeredCount').textContent = '0';
  window.scrollTo({top:0, behavior:'smooth'});
});
</script>
</body>
</html>
